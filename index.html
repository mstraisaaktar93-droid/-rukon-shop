<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rukon Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">🟠 Rukon Shop</a><a href="#products">পণ্য দেখুন</a><a href="/admin.html">অ্যাডমিন</a></header>
<section class="hero"><h1>আপনার পছন্দের পণ্য, এক জায়গায়</h1><p>Rukon Shop-এ স্বাগতম</p><a class="button" href="#products">এখনই কেনাকাটা করুন</a></section>
<main><h2 id="products">আমাদের পণ্য</h2><div id="product-list" class="products">পণ্য লোড হচ্ছে…</div>
<section class="checkout"><h2>অর্ডার সম্পন্ন করুন</h2><p id="cart-summary">আগে একটি পণ্য নির্বাচন করুন।</p><form id="checkout"><label>আপনার নাম<input name="customer_name" required></label><label>মোবাইল নম্বর<input name="phone" inputmode="tel" required></label><label>সম্পূর্ণ ঠিকানা<textarea name="address" required></textarea></label><label>পেমেন্ট পদ্ধতি<select name="payment_method"><option value="COD">ক্যাশ অন ডেলিভারি</option><option value="bKash">বিকাশ (মার্চেন্ট ইন্টিগ্রেশন না হওয়া পর্যন্ত চালু নয়)</option><option value="Nagad">নগদ (ইন্টিগ্রেশন প্রয়োজন)</option></select></label><button>অর্ডার দিন</button></form><p id="message" role="status"></p></section></main><footer>© Rukon Shop · বাংলাদেশ</footer><script src="/store.js"></script></body></html>
